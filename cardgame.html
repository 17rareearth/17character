<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レアアース17元素カードゲーム（印刷・保存用）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {

            /* 印刷時はヘッダーやフッター、余白を完全に除外 */
            .no-print {
                display: none !important;
            }

            html,
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
            }

            main {
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .print-page {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                /* 画像ごとに確実に改ページし、余計な白紙が入らないように指定 */
                page-break-inside: avoid;
                break-inside: avoid;
                page-break-after: always;
                break-after: page;
            }

            /* 最後の画像の後には改ページを入れない */
            .print-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen py-8 px-4 flex flex-col items-center">

    <!-- ヘッダー（印刷時は非表示） -->
    <header class="no-print max-w-2xl w-full text-center mb-6">
        <h1 class="text-xl font-bold text-slate-800 mb-2">レアアース17元素 カード＆選別シート</h1>
        <p class="text-xs text-slate-600 mb-4">スマホの場合は画像を長押しで保存できます。パソコンの場合は下のボタンから直接印刷できます。</p>
        <button onclick="window.print()"
            class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-blue-700 transition-colors">
            🖨️ このページを印刷する
        </button>
    </header>

    <!-- 画像コンテナ -->
    <main class="max-w-3xl w-full flex flex-col gap-6 items-center">
        <img src="cardgame1.png" alt="神経衰弱カード 1枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame2.png" alt="神経衰弱カード 2枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame3.png" alt="神経衰弱カード 3枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame4.png" alt="選別シート"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
    </main>

    <!-- フッター（印刷時は非表示） -->
    <footer class="no-print mt-8 text-center">
        <a href="index.html" class="text-sm text-slate-500 underline hover:text-slate-800">← 図鑑トップページへ戻る</a>
    </footer>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LearningResource",
      "name": "レアアース17元素 神経衰弱・選別ゲームカード（印刷用データ）",
      "description": "教育現場や家庭学習で使えるレアアース17元素の神経衰弱カードと分類選別シートの印刷用画像データ。",
      "learningResourceType": "Game",
      "educationalUse": "Instruction",
      "educationalLevel": "Primary Education",
      "inLanguage": "ja",
      "isAccessibleForFree": true,
      "url": "https://17rareearth.github.io/17character/cardgame.html",
      "image": [
        "https://17rareearth.github.io/17character/cardgame1.png",
        "https://17rareearth.github.io/17character/cardgame4.png"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "レアアース17元素キャラクター図鑑",
        "url": "https://17rareearth.github.io/17character/"
      }
    }
    </script>

</body>

</html>

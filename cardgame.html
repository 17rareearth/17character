<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レアアース17元素カードゲーム（印刷・保存用）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white;
                padding: 0;
            }

            .print-page {
                page-break-after: always;
                margin: 0;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen py-8 px-4 flex flex-col items-center">

    <!-- ヘッダー（印刷時は非表示） -->
    <header class="no-print max-w-2xl w-full text-center mb-6">
        <h1 class="text-xl font-bold text-slate-800 mb-2">レアアース17元素 カード＆選別シート</h1>
        <p class="text-xs text-slate-600 mb-4">スマホの場合は画像を長押しで保存できます。パソコンの場合は下のボタンから直接印刷できます。</p>
        <button onclick="window.print()"
            class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-blue-700 transition-colors">
            🖨️ このページを印刷する
        </button>
    </header>

    <!-- 画像コンテナ -->
    <main class="max-w-3xl w-full flex flex-col gap-6 items-center">
        <img src="cardgame1.png" alt="神経衰弱カード 1枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame2.png" alt="神経衰弱カード 2枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame3.png" alt="神経衰弱カード 3枚目"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
        <img src="cardgame4.png" alt="選別シート"
            class="print-page w-full bg-white rounded-2xl shadow-sm border border-slate-200">
    </main>

    <!-- フッター（印刷時は非表示） -->
    <footer class="no-print mt-8 text-center">
        <a href="index.html" class="text-sm text-slate-500 underline hover:text-slate-800">← 図鑑トップページへ戻る</a>
    </footer>

</body>

</html>
